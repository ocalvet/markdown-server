<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="vendor/css/github.min.css" id="hljs-light">
    <link rel="stylesheet" href="vendor/css/github-dark.min.css" id="hljs-dark" disabled>
    <link rel="stylesheet" href="vendor/css/vis-network.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-left">
                <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle sidebar">
                    <span class="toggle-icon">☰</span>
                </button>
                <a href="index.html" class="logo-link" title="Home">
                    <img src="logo.svg" alt="Markdown Server" class="logo header-logo">
                </a>
                <a href="index.html" class="title-link" title="Go to home">
                    <h1 id="fileName">Loading...</h1>
                </a>
            </div>
            <div class="header-right">
                <button id="tocToggle" class="toc-toggle" aria-label="Table of Contents" title="Table of Contents">
                    <span class="toc-icon">≡</span>
                </button>
                <button id="graphToggle" class="graph-toggle" aria-label="Knowledge Graph" title="Knowledge Graph">
                    <span class="graph-icon">🕸️</span>
                </button>
                <button id="searchToggle" class="search-toggle" aria-label="Search" title="Search (Ctrl+K)">
                    <span class="search-icon">🔍</span>
                </button>
                <button id="fontToggle" class="font-toggle" aria-label="Toggle font" title="Toggle font (Serif/Sans-serif)">
                    <span class="font-icon">Aa</span>
                </button>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                    <span class="theme-icon">◐</span>
                </button>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside id="sidebar" class="sidebar sidebar-open">
            <div class="sidebar-header">
                <a href="files.html" class="home-link">📁 Files</a>
            </div>
            <nav id="sidebarNav" class="sidebar-nav">
                <div class="loading">Loading files...</div>
            </nav>
        </aside>

        <main class="main-content">
            <div id="breadcrumb" class="breadcrumb"></div>
            <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                <div class="loading-bar"></div>
            </div>
            <!-- Feature 3: Frontmatter display -->
            <div id="frontmatterDisplay" class="frontmatter-display" style="display: none;"></div>
            <article id="content" class="markdown-content">
                <div class="loading">Loading content...</div>
            </article>
            <!-- Feature 5: Backlinks panel -->
            <div id="backlinksPanel" class="backlinks-panel" style="display: none;">
                <div class="backlinks-header">
                    <span class="backlinks-icon">←</span>
                    <h3>Linked from</h3>
                </div>
                <div id="backlinksList" class="backlinks-list"></div>
            </div>
        </main>

        <!-- Feature 4: TOC right-side panel -->
        <aside id="tocPanel" class="toc-panel">
            <div class="toc-header">On this page</div>
            <nav id="tocNav" class="toc-nav"></nav>
        </aside>
    </div>

    <div id="searchModal" class="search-modal" style="display: none;">
        <div class="search-backdrop"></div>
        <div class="search-container">
            <div class="search-header">
                <div class="search-input-wrapper">
                    <span class="search-input-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search files and content..." autocomplete="off">
                    <button id="searchClear" class="search-clear" style="display: none;">✕</button>
                </div>
                <button id="searchClose" class="search-close" aria-label="Close search">✕</button>
            </div>
            <div id="searchResults" class="search-results">
                <div class="search-empty">
                    <p>Type to search across all markdown files</p>
                    <p class="search-hint">Press <kbd>Esc</kbd> to close</p>
                </div>
            </div>
        </div>
    </div>

    <div id="graphModal" class="graph-modal" style="display: none;">
        <div class="graph-backdrop"></div>
        <div class="graph-container">
            <div class="graph-header">
                <h2>Knowledge Graph</h2>
                <button id="graphClose" class="graph-close" aria-label="Close graph">✕</button>
            </div>
            <div id="graphCanvas" class="graph-canvas"></div>
            <div class="graph-info">
                <div id="graphStats" class="graph-stats"></div>
            </div>
        </div>
    </div>

    <script src="vendor/js/marked.min.js"></script>
    <script src="vendor/js/mermaid.min.js"></script>
    <script src="vendor/js/highlight.min.js"></script>
    <script src="vendor/js/fuse.min.js"></script>
    <script src="vendor/js/vis-network.min.js"></script>
    <script src="vendor/js/js-yaml.min.js"></script>
    <script>
        const API_BASE = window.location.origin;

        // ─── Theme ────────────────────────────────────────────────────────────
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateHighlightTheme(savedTheme);
        }

        function updateHighlightTheme(theme) {
            document.getElementById('hljs-light').disabled = (theme === 'dark');
            document.getElementById('hljs-dark').disabled  = (theme !== 'dark');
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateHighlightTheme(next);
        });

        // ─── Font Toggle ─────────────────────────────────────────────────────
        function initFont() {
            const savedFont = localStorage.getItem('fontFamily') || 'sans';
            document.documentElement.setAttribute('data-font', savedFont);
            updateFontIcon(savedFont);
        }

        function updateFontIcon(font) {
            const icon = document.querySelector('.font-icon');
            if (icon) icon.textContent = font === 'serif' ? 'Sf' : 'Aa';
        }

        document.getElementById('fontToggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-font') || 'sans';
            const next = current === 'sans' ? 'serif' : 'sans';
            document.documentElement.setAttribute('data-font', next);
            localStorage.setItem('fontFamily', next);
            updateFontIcon(next);
        });

        // ─── Sidebar ──────────────────────────────────────────────────────────
        function initSidebar() {
            const saved = localStorage.getItem('sidebarOpen');
            const sidebar = document.getElementById('sidebar');
            if (saved !== null) {
                sidebar.classList.toggle('sidebar-open', saved === 'true');
            }
        }

        document.getElementById('sidebarToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('sidebar-open');
            localStorage.setItem('sidebarOpen', sidebar.classList.contains('sidebar-open'));
        });

        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            if (window.innerWidth <= 768 &&
                sidebar.classList.contains('sidebar-open') &&
                !sidebar.contains(e.target) &&
                !sidebarToggle.contains(e.target)) {
                sidebar.classList.remove('sidebar-open');
            }
        });

        // ─── TOC Panel ────────────────────────────────────────────────────────
        function initTOC() {
            const saved = localStorage.getItem('tocOpen');
            const panel = document.getElementById('tocPanel');
            // Default: open on desktop, closed on mobile
            const defaultOpen = window.innerWidth > 1100;
            panel.classList.toggle('toc-open', saved !== null ? saved === 'true' : defaultOpen);
        }

        document.getElementById('tocToggle').addEventListener('click', () => {
            const panel = document.getElementById('tocPanel');
            panel.classList.toggle('toc-open');
            localStorage.setItem('tocOpen', panel.classList.contains('toc-open'));
        });

        let tocObserver = null;

        function generateTOC() {
            const content = document.getElementById('content');
            const tocNav  = document.getElementById('tocNav');
            const panel   = document.getElementById('tocPanel');
            const headings = Array.from(content.querySelectorAll('h1, h2, h3, h4, h5, h6'));

            // Disconnect previous observer
            if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }

            if (headings.length === 0) {
                tocNav.innerHTML = '<div class="toc-empty">No headings found</div>';
                return;
            }

            // Assign IDs and add anchor links to each heading
            const slugCount = {};
            headings.forEach(h => {
                let slug = h.textContent
                    .toLowerCase()
                    .replace(/[^\w\s-]/g, '')
                    .trim()
                    .replace(/\s+/g, '-');
                if (slugCount[slug] !== undefined) {
                    slugCount[slug]++;
                    slug = `${slug}-${slugCount[slug]}`;
                } else {
                    slugCount[slug] = 0;
                }
                h.id = slug;

                // Add hover anchor link
                const anchor = document.createElement('a');
                anchor.className = 'heading-anchor';
                anchor.href = `#${slug}`;
                anchor.textContent = '#';
                anchor.setAttribute('aria-hidden', 'true');
                h.appendChild(anchor);
            });

            // Build nested TOC list
            const minLevel = Math.min(...headings.map(h => parseInt(h.tagName[1])));
            const items = headings.map(h => {
                const level = parseInt(h.tagName[1]);
                const indent = level - minLevel;
                const link = document.createElement('a');
                link.href = `#${h.id}`;
                link.className = 'toc-link';
                link.style.paddingLeft = `${indent * 12}px`;
                link.textContent = h.textContent.replace(/#$/, '').trim();
                link.dataset.headingId = h.id;
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    h.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                return link;
            });

            tocNav.innerHTML = '';
            items.forEach(item => tocNav.appendChild(item));

            // IntersectionObserver to highlight active heading
            tocObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const link = tocNav.querySelector(`[data-heading-id="${entry.target.id}"]`);
                    if (link) {
                        link.classList.toggle('toc-active', entry.isIntersecting);
                    }
                });
            }, { rootMargin: '0px 0px -80% 0px', threshold: 0 });

            headings.forEach(h => tocObserver.observe(h));
        }

        // ─── File Tree ────────────────────────────────────────────────────────
        function renderFileTree(files, container, level = 0, currentFilePath = '') {
            files.forEach(file => {
                if (file.isDir) {
                    const folderItem = document.createElement('div');
                    folderItem.className = 'sidebar-folder';
                    folderItem.style.paddingLeft = `${level * 12}px`;

                    const folderHeader = document.createElement('div');
                    folderHeader.className = 'folder-header';
                    folderHeader.innerHTML = `<span class="folder-toggle">▸</span> <span class="folder-icon">📁</span> ${file.name}`;
                    folderItem.appendChild(folderHeader);

                    const folderContent = document.createElement('div');
                    folderContent.className = 'folder-content';
                    folderContent.style.display = 'none';
                    folderItem.appendChild(folderContent);

                    const containsCurrentFile = currentFilePath.startsWith(file.path + '/');
                    if (containsCurrentFile) {
                        folderContent.style.display = 'block';
                        folderHeader.querySelector('.folder-toggle').textContent = '▾';
                    }

                    folderHeader.addEventListener('click', () => {
                        const isOpen = folderContent.style.display === 'block';
                        folderContent.style.display = isOpen ? 'none' : 'block';
                        folderHeader.querySelector('.folder-toggle').textContent = isOpen ? '▸' : '▾';
                    });

                    container.appendChild(folderItem);

                    if (file.children && file.children.length > 0) {
                        renderFileTree(file.children, folderContent, level + 1, currentFilePath);
                    }
                } else {
                    const fileItem = document.createElement('a');
                    fileItem.href = `viewer.html?file=${encodeURIComponent(file.path)}`;
                    fileItem.className = 'sidebar-file';
                    fileItem.style.paddingLeft = `${level * 12 + 20}px`;
                    fileItem.title = file.name;
                    fileItem.innerHTML = `<span class="file-icon">📄</span><span class="sidebar-file-name">${file.name}</span>`;

                    const urlParams = new URLSearchParams(window.location.search);
                    if (file.path === urlParams.get('file')) {
                        fileItem.classList.add('active');
                        setTimeout(() => fileItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
                    }

                    fileItem.addEventListener('click', (e) => {
                        e.preventDefault();
                        navigateToFile(file.path);
                        if (window.innerWidth <= 768) {
                            setTimeout(() => document.getElementById('sidebar').classList.remove('sidebar-open'), 100);
                        }
                    });

                    container.appendChild(fileItem);
                }
            });
        }

        async function loadFileTree(forceRefresh = false) {
            const cacheKey = CacheManager.getKey('fileTree', 'all');
            try {
                const response = await fetch(`${API_BASE}/api/files`);
                fileTreeData = await response.json();
                CacheManager.set(cacheKey, fileTreeData);
                renderCachedFileTree();
            } catch (error) {
                // Offline: fall back to cache
                const cached = CacheManager.get(cacheKey);
                if (cached) {
                    fileTreeData = cached;
                    renderCachedFileTree();
                } else {
                    document.getElementById('sidebarNav').innerHTML = '<div class="error">Error loading files</div>';
                }
            }
        }

        function renderCachedFileTree() {
            const container = document.getElementById('sidebarNav');
            container.innerHTML = '';
            const currentFile = new URLSearchParams(window.location.search).get('file') || '';
            if (!fileTreeData || fileTreeData.length === 0) {
                container.innerHTML = '<div class="empty-state">No files found</div>';
            } else {
                renderFileTree(fileTreeData, container, 0, currentFile);
            }
        }

        function navigateToFile(filePath) {
            window.history.pushState({ filePath }, '', `viewer.html?file=${encodeURIComponent(filePath)}`);
            loadMarkdown();
            renderCachedFileTree();
        }

        window.addEventListener('popstate', () => { loadMarkdown(); renderCachedFileTree(); });

        // ─── Breadcrumb ───────────────────────────────────────────────────────
        function renderBreadcrumb(filePath) {
            const parts = filePath.split('/');
            document.getElementById('breadcrumb').innerHTML = parts.map((part, i) =>
                i === parts.length - 1
                    ? `<span class="breadcrumb-current">${part}</span>`
                    : `<span class="breadcrumb-item">${part}</span>`
            ).join('<span class="breadcrumb-separator">/</span>');
        }

        // ─── Feature 3: Frontmatter ───────────────────────────────────────────
        function parseFrontmatter(markdown) {
            if (!markdown.startsWith('---')) {
                return { frontmatter: null, content: markdown };
            }
            const end = markdown.indexOf('\n---', 3);
            if (end === -1) {
                return { frontmatter: null, content: markdown };
            }
            const yamlStr = markdown.slice(3, end).trim();
            const remaining = markdown.slice(end + 4).trimStart();
            try {
                const fm = (typeof jsyaml !== 'undefined')
                    ? jsyaml.load(yamlStr)
                    : parseSimpleYAML(yamlStr);
                return { frontmatter: fm && typeof fm === 'object' ? fm : null, content: remaining };
            } catch (e) {
                return { frontmatter: null, content: remaining };
            }
        }

        // Simple fallback YAML parser (key: value only)
        function parseSimpleYAML(str) {
            const result = {};
            str.split('\n').forEach(line => {
                const m = line.match(/^([^:]+):\s*(.*)$/);
                if (m) result[m[1].trim()] = m[2].trim();
            });
            return result;
        }

        function renderFrontmatter(fm) {
            const el = document.getElementById('frontmatterDisplay');
            if (!fm || Object.keys(fm).length === 0) { el.style.display = 'none'; return; }

            const priorityKeys = ['title', 'description', 'author', 'date', 'tags'];
            const allKeys = [...new Set([...priorityKeys.filter(k => k in fm), ...Object.keys(fm).filter(k => !priorityKeys.includes(k))])];

            const parts = allKeys.map(key => {
                const val = fm[key];
                if (key === 'tags') {
                    const tags = Array.isArray(val) ? val : String(val).split(',').map(t => t.trim());
                    const tagHTML = tags.map(t => `<span class="fm-tag">${escapeHTML(t)}</span>`).join('');
                    return `<div class="fm-item"><span class="fm-key">tags</span><span class="fm-tags">${tagHTML}</span></div>`;
                }
                if (key === 'date' && val) {
                    const d = new Date(val);
                    const formatted = isNaN(d) ? val : d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
                    return `<div class="fm-item"><span class="fm-key">${escapeHTML(key)}</span><span class="fm-value">${escapeHTML(formatted)}</span></div>`;
                }
                if (Array.isArray(val)) {
                    return `<div class="fm-item"><span class="fm-key">${escapeHTML(key)}</span><span class="fm-value">${escapeHTML(val.join(', '))}</span></div>`;
                }
                return `<div class="fm-item"><span class="fm-key">${escapeHTML(key)}</span><span class="fm-value">${escapeHTML(String(val))}</span></div>`;
            });

            el.innerHTML = `<div class="fm-grid">${parts.join('')}</div>`;
            el.style.display = 'block';
        }

        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ─── Feature 2: Internal link + image resolution ──────────────────────
        function interceptContentLinks(filePath) {
            const content = document.getElementById('content');
            const fileDir = filePath.includes('/') ? filePath.substring(0, filePath.lastIndexOf('/')) : '';

            // Rewrite <a> links pointing to .md files
            content.querySelectorAll('a[href]').forEach(a => {
                const href = a.getAttribute('href');
                if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto:')) return;

                // Strip anchor fragment
                const [pathPart, fragment] = href.split('#');
                let target = pathPart;

                // Resolve relative to current file's directory
                if (!target.startsWith('/')) {
                    target = fileDir ? `${fileDir}/${target}` : target;
                } else {
                    target = target.slice(1); // strip leading /
                }
                // Normalize path segments (handle ../ etc.)
                target = normalizePath(target);

                // Ensure .md extension
                if (!target.endsWith('.md')) target += '.md';

                a.href = `viewer.html?file=${encodeURIComponent(target)}${fragment ? '#' + fragment : ''}`;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    navigateToFile(target);
                    if (fragment) {
                        setTimeout(() => {
                            const el = document.getElementById(fragment);
                            if (el) el.scrollIntoView({ behavior: 'smooth' });
                        }, 300);
                    }
                });
            });

            // Rewrite <img> src pointing to local files
            content.querySelectorAll('img[src]').forEach(img => {
                const src = img.getAttribute('src');
                if (!src || src.startsWith('http') || src.startsWith('data:')) return;
                let assetPath = src.startsWith('/') ? src.slice(1) : (fileDir ? `${fileDir}/${src}` : src);
                assetPath = normalizePath(assetPath);
                img.src = `${API_BASE}/api/asset/${assetPath}`;
            });
        }

        // Normalize a path: resolve . and .. segments
        function normalizePath(path) {
            const parts = path.split('/');
            const result = [];
            for (const part of parts) {
                if (part === '..') result.pop();
                else if (part !== '.') result.push(part);
            }
            return result.join('/');
        }

        // ─── Feature 5: Backlinks ─────────────────────────────────────────────
        async function loadBacklinks(filePath) {
            const panel = document.getElementById('backlinksPanel');
            const list  = document.getElementById('backlinksList');
            try {
                const resp = await fetch(`${API_BASE}/api/backlinks/${filePath}`);
                if (!resp.ok) { panel.style.display = 'none'; return; }
                const data = await resp.json();
                const links = data.backlinks || [];
                if (links.length === 0) { panel.style.display = 'none'; return; }

                list.innerHTML = links.map(bl => `
                    <div class="backlink-item" data-path="${escapeHTML(bl.path)}">
                        <a href="viewer.html?file=${encodeURIComponent(bl.path)}" class="backlink-name">📄 ${escapeHTML(bl.name)}</a>
                        ${bl.context ? `<div class="backlink-context">${escapeHTML(bl.context)}</div>` : ''}
                    </div>
                `).join('');

                list.querySelectorAll('.backlink-item').forEach(item => {
                    item.querySelector('.backlink-name').addEventListener('click', (e) => {
                        e.preventDefault();
                        navigateToFile(item.dataset.path);
                    });
                });

                panel.style.display = 'block';
            } catch (e) {
                panel.style.display = 'none';
            }
        }

        // ─── loadMarkdown ─────────────────────────────────────────────────────
        async function loadMarkdown(forceRefresh = false) {
            const filePath = new URLSearchParams(window.location.search).get('file');
            if (!filePath) {
                document.getElementById('content').innerHTML = '<div class="error">No file specified</div>';
                document.getElementById('frontmatterDisplay').style.display = 'none';
                document.getElementById('backlinksPanel').style.display = 'none';
                document.getElementById('tocNav').innerHTML = '';
                return;
            }

            const loadingIndicator = document.getElementById('loadingIndicator');
            try {
                loadingIndicator.style.display = 'block';
                document.getElementById('fileName').textContent = filePath.split('/').pop();
                renderBreadcrumb(filePath);

                // Always fetch from network; fall back to cache only when offline
                const cacheKey = CacheManager.getKey('file', filePath);
                let rawMarkdown;
                try {
                    const response = await fetch(`${API_BASE}/api/file/${filePath}`);
                    if (!response.ok) throw new Error('File not found');
                    rawMarkdown = await response.text();
                    CacheManager.set(cacheKey, { content: rawMarkdown, timestamp: Date.now() });
                } catch (fetchError) {
                    const cached = CacheManager.get(cacheKey);
                    if (cached) {
                        rawMarkdown = cached.content;
                    } else {
                        throw fetchError;
                    }
                }

                // Feature 3: parse and strip frontmatter before rendering
                const { frontmatter, content: markdownBody } = parseFrontmatter(rawMarkdown);
                renderFrontmatter(frontmatter);

                // Update page title from frontmatter if available
                if (frontmatter && frontmatter.title) {
                    document.getElementById('fileName').textContent = frontmatter.title;
                }

                marked.setOptions({
                    highlight: (code, lang) => {
                        if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
                        return hljs.highlightAuto(code).value;
                    },
                    breaks: true,
                    gfm: true
                });

                document.getElementById('content').innerHTML = marked.parse(markdownBody);

                // Feature 2: rewrite internal links and image URLs
                interceptContentLinks(filePath);

                // Feature 4: generate TOC from rendered headings
                generateTOC();

                if (typeof mermaid !== 'undefined') {
                    mermaid.initialize({
                        startOnLoad: true,
                        theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'default'
                    });
                    await mermaid.run({ querySelector: '.language-mermaid' });
                }

                loadingIndicator.style.display = 'none';

                // Feature 5: load backlinks (non-blocking)
                loadBacklinks(filePath);

            } catch (error) {
                loadingIndicator.style.display = 'none';
                document.getElementById('content').innerHTML = '<div class="error">Error loading file. Please try again.</div>';
                console.error('Error loading markdown:', error);
            }
        }

        // ─── Hot Reload ───────────────────────────────────────────────────────
        function initHotReload() {
            let reconnectDelay = 1000;
            function connect() {
                try {
                    const eventSource = new EventSource(`${API_BASE}/api/events`);
                    eventSource.onmessage = (event) => {
                        if (event.data === 'reload') {
                            CacheManager.remove(CacheManager.getKey('fileTree', 'all'));
                            const fp = new URLSearchParams(window.location.search).get('file');
                            if (fp) CacheManager.remove(CacheManager.getKey('file', fp));
                            loadMarkdown(true);
                            loadFileTree(true);
                            buildSearchIndex();
                        }
                    };
                    eventSource.addEventListener('connected', () => {
                        reconnectDelay = 1000;
                        console.log('Hot reload connected');
                    });
                    eventSource.onerror = () => {
                        eventSource.close();
                        setTimeout(connect, reconnectDelay);
                        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
                    };
                } catch (e) {
                    console.log('Hot reload not available');
                }
            }
            connect();
        }

        // ─── State ────────────────────────────────────────────────────────────
        let fileTreeData = null;
        let searchIndex  = [];
        let fuse         = null;

        // ─── Cache Manager ────────────────────────────────────────────────────
        const CacheManager = {
            maxCacheSize: 5 * 1024 * 1024,
            currentSize: 0,
            getKey(type, path) { return `markdown-server:${type}:${path}`; },
            get(key) {
                try { const i = localStorage.getItem(key); return i ? JSON.parse(i) : null; }
                catch { return null; }
            },
            set(key, value) {
                try {
                    const item = JSON.stringify(value);
                    this.currentSize += item.length * 2;
                    if (this.currentSize > this.maxCacheSize * 0.9) this.evictOldest();
                    localStorage.setItem(key, item);
                    return true;
                } catch { return false; }
            },
            remove(key) { try { localStorage.removeItem(key); } catch {} },
            clear() {
                try {
                    Object.keys(localStorage).filter(k => k.startsWith('markdown-server:')).forEach(k => localStorage.removeItem(k));
                    this.currentSize = 0;
                } catch {}
            },
            evictOldest() { console.log('Cache limit reached, clearing'); this.clear(); }
        };

        // ─── Search ───────────────────────────────────────────────────────────
        async function buildSearchIndex() {
            try {
                const response = await fetch(`${API_BASE}/api/files`);
                const files = await response.json();
                const indexPromises = [];

                function collectFiles(list) {
                    list.forEach(file => {
                        if (file.isDir && file.children) {
                            collectFiles(file.children);
                        } else if (!file.isDir) {
                            indexPromises.push((async () => {
                                const cacheKey = CacheManager.getKey('file', file.path);
                                try {
                                    const r = await fetch(`${API_BASE}/api/file/${file.path}`);
                                    const content = await r.text();
                                    CacheManager.set(cacheKey, { content, timestamp: Date.now() });
                                    return { name: file.name, path: file.path, content: content.substring(0, 5000) };
                                } catch {
                                    // Offline: fall back to cache
                                    const cached = CacheManager.get(cacheKey);
                                    if (cached) return { name: file.name, path: file.path, content: cached.content.substring(0, 5000) };
                                    return null;
                                }
                            })());
                        }
                    });
                }

                collectFiles(files);
                searchIndex = (await Promise.all(indexPromises)).filter(Boolean);
                fuse = new Fuse(searchIndex, {
                    keys: [{ name: 'name', weight: 2 }, { name: 'path', weight: 1.5 }, { name: 'content', weight: 1 }],
                    threshold: 0.4, includeMatches: true, minMatchCharLength: 2, ignoreLocation: true
                });
                console.log(`Search index built: ${searchIndex.length} files`);
            } catch (e) {
                console.error('Error building search index:', e);
            }
        }

        function openSearch() {
            document.getElementById('searchModal').style.display = 'flex';
            document.getElementById('searchInput').focus();
            document.body.style.overflow = 'hidden';
        }

        function closeSearch() {
            document.getElementById('searchModal').style.display = 'none';
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').style.display = 'none';
            document.body.style.overflow = '';
            renderSearchResults([]);
        }

        function highlightMatch(text, indices) {
            if (!indices || !indices.length) return text;
            let result = '', last = 0;
            indices.forEach(([s, e]) => {
                result += text.substring(last, s) + `<mark>${text.substring(s, e + 1)}</mark>`;
                last = e + 1;
            });
            return result + text.substring(last);
        }

        function renderSearchResults(results) {
            const container = document.getElementById('searchResults');
            if (!results.length) {
                container.innerHTML = `<div class="search-empty"><p>No results found</p><p class="search-hint">Try different keywords</p></div>`;
                return;
            }
            const html = results.map(result => {
                const item = result.item;
                const matches = result.matches || [];
                let nameHTML = item.name, pathHTML = item.path, snippetHTML = '';
                matches.forEach(m => {
                    if (m.key === 'name') nameHTML = highlightMatch(item.name, m.indices);
                    else if (m.key === 'path') pathHTML = highlightMatch(item.path, m.indices);
                    else if (m.key === 'content' && m.indices.length) {
                        const s = Math.max(0, m.indices[0][0] - 50);
                        const e = Math.min(item.content.length, m.indices[0][1] + 100);
                        const adj = m.indices.map(([a, b]) => [Math.max(0, a - s), Math.min(e - s - 1, b - s)]);
                        const snip = item.content.substring(s, e).replace(/\n/g, ' ').trim();
                        snippetHTML = (s > 0 ? '…' : '') + highlightMatch(snip, adj) + (e < item.content.length ? '…' : '');
                    }
                });
                if (!snippetHTML && item.content) snippetHTML = item.content.substring(0, 150).replace(/\n/g, ' ') + '…';
                return `<div class="search-result-item" data-path="${item.path}" tabindex="0">
                    <div class="search-result-name">${nameHTML}</div>
                    <div class="search-result-path">${pathHTML}</div>
                    ${snippetHTML ? `<div class="search-result-snippet">${snippetHTML}</div>` : ''}
                </div>`;
            }).join('');
            container.innerHTML = `<div class="search-result-count">${results.length} result${results.length !== 1 ? 's' : ''}</div>${html}`;
            container.querySelectorAll('.search-result-item').forEach(item => {
                item.addEventListener('click', () => { closeSearch(); navigateToFile(item.dataset.path); });
                item.addEventListener('keydown', e => { if (e.key === 'Enter') item.click(); });
            });
        }

        let searchTimeout;
        function performSearch(query) {
            clearTimeout(searchTimeout);
            document.getElementById('searchClear').style.display = query ? 'block' : 'none';
            if (!query || query.length < 2) { renderSearchResults([]); return; }
            searchTimeout = setTimeout(() => {
                if (fuse) renderSearchResults(fuse.search(query).slice(0, 20));
            }, 300);
        }

        document.getElementById('searchToggle').addEventListener('click', openSearch);
        document.getElementById('searchClose').addEventListener('click', closeSearch);
        document.getElementById('searchClear').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClear').style.display = 'none';
            renderSearchResults([]);
            document.getElementById('searchInput').focus();
        });
        document.querySelector('.search-backdrop').addEventListener('click', closeSearch);
        document.getElementById('searchInput').addEventListener('input', e => performSearch(e.target.value));

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
            if (e.key === 'Escape') {
                if (document.getElementById('searchModal').style.display === 'flex') closeSearch();
            }
        });

        document.getElementById('searchResults').addEventListener('keydown', e => {
            const items = Array.from(document.querySelectorAll('.search-result-item'));
            const idx = items.indexOf(document.activeElement);
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (idx < items.length - 1) items[idx + 1].focus();
                else if (idx === -1 && items.length) items[0].focus();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (idx > 0) items[idx - 1].focus();
                else if (idx === 0) document.getElementById('searchInput').focus();
            }
        });

        // ─── Knowledge Graph ──────────────────────────────────────────────────
        let graphNetwork = null, graphData = null, graphNodes = null, graphEdges = null;

        async function loadGraph() {
            try {
                const r = await fetch(`${API_BASE}/api/graph`);
                graphData = await r.json();
                return graphData;
            } catch { return null; }
        }

        function updateGraphHighlight(newCurrentFile) {
            if (!graphNodes || !graphNetwork) return;
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            graphNodes.forEach(node => {
                const isCurrent = node.id === newCurrentFile;
                graphNodes.update({
                    id: node.id,
                    size: isCurrent ? 25 : 15,
                    color: {
                        background: isCurrent ? (isDark ? '#ff6b6b' : '#e74c3c') : (isDark ? '#4da6ff' : '#0066cc'),
                        border:     isCurrent ? (isDark ? '#ff8787' : '#c0392b') : (isDark ? '#66b3ff' : '#0052a3'),
                        highlight: {
                            background: isCurrent ? (isDark ? '#ff8787' : '#c0392b') : (isDark ? '#66b3ff' : '#0052a3'),
                            border:     isCurrent ? (isDark ? '#ff6b6b' : '#e74c3c') : (isDark ? '#4da6ff' : '#0066cc'),
                        }
                    },
                    font: { color: isDark ? '#e0e0e0' : '#1a1a1a', size: isCurrent ? 16 : 14, bold: isCurrent }
                });
            });
            if (newCurrentFile && graphNodes.get(newCurrentFile)) {
                graphNetwork.focus(newCurrentFile, { scale: 1.2, animation: { duration: 800, easingFunction: 'easeInOutQuad' } });
            }
            updateGraphStats(graphData);
        }

        function openGraph() {
            document.getElementById('graphModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            if (!graphNetwork) renderGraph();
        }

        function closeGraph() {
            document.getElementById('graphModal').style.display = 'none';
            document.body.style.overflow = '';
        }

        async function renderGraph() {
            const data = await loadGraph();
            if (!data || typeof vis === 'undefined') return;
            const container = document.getElementById('graphCanvas');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const currentFile = new URLSearchParams(window.location.search).get('file');

            graphNodes = new vis.DataSet(data.nodes.map(node => {
                const isCurrent = node.id === currentFile;
                return {
                    id: node.id, label: node.label, title: node.title, shape: 'dot',
                    size: isCurrent ? 25 : 15,
                    color: {
                        background: isCurrent ? (isDark ? '#ff6b6b' : '#e74c3c') : (isDark ? '#4da6ff' : '#0066cc'),
                        border:     isCurrent ? (isDark ? '#ff8787' : '#c0392b') : (isDark ? '#66b3ff' : '#0052a3'),
                        highlight: {
                            background: isCurrent ? (isDark ? '#ff8787' : '#c0392b') : (isDark ? '#66b3ff' : '#0052a3'),
                            border:     isCurrent ? (isDark ? '#ff6b6b' : '#e74c3c') : (isDark ? '#4da6ff' : '#0066cc'),
                        }
                    },
                    font: { color: isDark ? '#e0e0e0' : '#1a1a1a', size: isCurrent ? 16 : 14, bold: isCurrent }
                };
            }));

            graphEdges = new vis.DataSet(data.edges.map(edge => ({
                from: edge.from, to: edge.to, arrows: 'to',
                color: { color: isDark ? '#3a3a3a' : '#e0e0e0', highlight: isDark ? '#4da6ff' : '#0066cc' },
                smooth: { type: 'curvedCW', roundness: 0.2 }
            })));

            try {
                graphNetwork = new vis.Network(container, { nodes: graphNodes, edges: graphEdges }, {
                    physics: { enabled: true, barnesHut: { gravitationalConstant: -2000, centralGravity: 0.3, springLength: 95, springConstant: 0.04, damping: 0.09 }, stabilization: { iterations: 200 } },
                    interaction: { hover: true, tooltipDelay: 200, navigationButtons: true, keyboard: true }
                });
                graphNetwork.on('click', params => {
                    if (params.nodes.length) { navigateToFile(params.nodes[0]); updateGraphHighlight(params.nodes[0]); }
                });
                graphNetwork.on('doubleClick', params => { if (params.nodes.length) closeGraph(); });
                graphNetwork.once('stabilizationIterationsDone', () => {
                    if (currentFile && graphNodes.get(currentFile)) {
                        graphNetwork.focus(currentFile, { scale: 1.2, animation: { duration: 800, easingFunction: 'easeInOutQuad' } });
                    } else {
                        graphNetwork.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
                    }
                });
                updateGraphStats(data);
            } catch (e) {
                console.error('Error creating graph:', e);
            }
        }

        function updateGraphStats(data) {
            if (!data) return;
            const currentFile = new URLSearchParams(window.location.search).get('file');
            const orphaned = data.nodes.filter(n => !data.edges.some(e => e.to === n.id) && !data.edges.some(e => e.from === n.id));
            const cfLinks = currentFile
                ? { out: data.edges.filter(e => e.from === currentFile).length, in: data.edges.filter(e => e.to === currentFile).length }
                : null;
            let html = `
                <div class="graph-stat-item"><span class="graph-stat-label">Files:</span><span>${data.nodes.length}</span></div>
                <div class="graph-stat-item"><span class="graph-stat-label">Links:</span><span>${data.edges.length}</span></div>
                <div class="graph-stat-item"><span class="graph-stat-label">Orphaned:</span><span>${orphaned.length}</span></div>
                <div class="graph-stat-item"><span class="graph-stat-label">Avg Links/File:</span><span>${data.nodes.length ? (data.edges.length / data.nodes.length).toFixed(2) : 0}</span></div>
            `;
            if (cfLinks) html += `<div class="graph-stat-item" style="margin-left:auto;color:var(--accent)"><span class="graph-stat-label">Current File:</span><span>${cfLinks.out} outgoing, ${cfLinks.in} incoming</span></div>`;
            document.getElementById('graphStats').innerHTML = html;
        }

        document.getElementById('graphToggle').addEventListener('click', openGraph);
        document.getElementById('graphClose').addEventListener('click', closeGraph);
        document.querySelector('.graph-backdrop').addEventListener('click', closeGraph);

        // ─── Service Worker ───────────────────────────────────────────────────
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }

        // ─── Init ─────────────────────────────────────────────────────────────
        initTheme();
        initFont();
        initSidebar();
        initTOC();
        loadFileTree();
        loadMarkdown();
        initHotReload();
        buildSearchIndex();
    </script>
</body>
</html>
